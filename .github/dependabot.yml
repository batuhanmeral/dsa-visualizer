version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-config-next's react, import and jsx-a11y plugins don't support ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Types track the Node major CI runs on (24), not the latest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
